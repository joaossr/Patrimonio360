<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111315">
    <title>Criar conta · Patrimônio 360</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" type="image/png" href="assets/images/icon-192.png">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/auth-v43.css">
</head>
<body>
<main class="login-page register-page">
    <div class="login-left">
        <form id="registerForm" class="login-card" novalidate>
            <img src="assets/images/logo-full.png" alt="" class="auth-mobile-logo" aria-hidden="true">
            <h1>Criar conta</h1>
            <p>Comece a organizar sua vida financeira.</p>
            <div class="form-group"><label for="name">Nome</label><input id="name" type="text" placeholder="Seu nome" autocomplete="name" maxlength="80" required></div>
            <div class="form-group"><label for="email">E-mail</label><input id="email" type="email" placeholder="seu@email.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required></div>
            <div class="form-group"><label for="password">Senha</label><input id="password" type="password" placeholder="Mínimo de 8 caracteres, com letras e números" autocomplete="new-password" minlength="8" required aria-describedby="passwordMeter"><div class="password-meter" id="passwordMeter" data-score="-1"><i></i><i></i><i></i><i></i><span></span></div></div>
            <div class="form-group"><label for="confirmPassword">Confirmar senha</label><input id="confirmPassword" type="password" placeholder="Digite a senha novamente" autocomplete="new-password" required></div>
            <span id="message" class="form-message" aria-live="polite"></span>
            <button type="submit" class="btn-login">Criar conta</button>
            <button type="button" id="btnLogin" class="btn-secondary">Já tenho conta</button>
        </form>
    </div>
    <div class="login-right">
        <div class="register-brand">
            <img src="assets/images/logo-full.png" alt="Patrimônio 360">
            <h2>Seu patrimônio começa com organização.</h2>
            <p>Crie sua conta e tenha receitas, despesas, cartões, metas e investimentos em um único lugar.</p>
        </div>
    </div>
</main>
<script type="module" src="assets/js/auth/register-page.js"></script>
</body>
</html>
