<!DOCTYPE html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Criar Conta - Patrimônio 360</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="assets/css/variables.css"><link rel="stylesheet" href="assets/css/reset.css"><link rel="stylesheet" href="assets/css/global.css"><link rel="stylesheet" href="assets/css/login.css"></head><body><div class="login-page register-page"><div class="login-left"><form id="registerForm" class="login-card"><h2>Criar Conta</h2><p>Comece a organizar sua vida financeira.</p><div class="form-group"><label>Nome</label><input id="name" type="text" placeholder="Seu nome" required></div><div class="form-group"><label>Email</label><input id="email" type="email" placeholder="seu@email.com" required></div><div class="form-group"><label>Senha</label><input id="password" type="password" placeholder="Mínimo de 6 caracteres" required></div><div class="form-group"><label>Confirmar Senha</label><input id="confirmPassword" type="password" placeholder="Digite a senha novamente" required></div><button type="submit" class="btn-login">Criar Conta</button><button type="button" id="btnLogin" class="btn-secondary">Voltar para Login</button><span id="message"></span></form></div><div class="login-right"><div class="register-brand"><img src="assets/images/logo_1.png" alt="Patrimônio 360"><h2>Seu patrimônio começa com organização.</h2><p>Crie sua conta e tenha receitas, despesas, cartões, metas e investimentos em um único lugar.</p></div></div></div><script type="module" src="assets/js/auth/register-page.js"></script></body></html>
