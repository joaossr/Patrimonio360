name: Patrimonio360 AI Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ai-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run test:ai
