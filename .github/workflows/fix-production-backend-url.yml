name: Fix production backend URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix production backend integration
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          original = text

          replacements = [
              (
                  "const DEFAULT_BACKEND_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port === '8787' ? location.origin : 'http://localhost:8787';",
                  "const DEFAULT_BACKEND_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port === '8787' ? location.origin : 'https://patrimonio360-hqka.onrender.com';"
              ),
              (
                  "fetch(`${AI_BACKEND_URL}/health`,",
                  "fetch(`${AI_BACKEND_URL}/api/status`,"
              ),
              (
                  "const timer=setTimeout(()=>controller.abort(),2500);",
                  "const timer=setTimeout(()=>controller.abort(),10000);"
              )
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)

          if text == original:
              print('Nenhuma alteração necessária no app.js.')
              raise SystemExit(0)

          path.write_text(text, encoding='utf-8')
          print('Frontend P360 ajustado: backend de produção + endpoint /api/status.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- app.js; then
            echo 'Sem alterações para commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Corrige conexão da IA com backend em produção'
          git push
