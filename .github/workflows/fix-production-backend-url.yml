name: Fix production backend URL

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-url:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update backend URL
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('app.js')
          text = path.read_text(encoding='utf-8')
          old = "const DEFAULT_BACKEND_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port === '8787' ? location.origin : 'http://localhost:8787';"
          new = "const DEFAULT_BACKEND_URL = (location.hostname === 'localhost' || location.hostname === '127.0.0.1') && location.port === '8787' ? location.origin : 'https://patrimonio360-hqka.onrender.com';"
          if old not in text:
              print('URL antiga não encontrada; nenhuma alteração necessária.')
              raise SystemExit(0)
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          print('URL do backend atualizada para produção.')
          PY

      - name: Commit and push
        run: |
          if git diff --quiet -- app.js; then
            echo 'Sem alterações para commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git commit -m 'Conecta frontend ao backend em produção'
          git push
