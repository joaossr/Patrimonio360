<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#111315">
    <meta name="description" content="Entre no Patrimônio 360 para controlar receitas, despesas, cartões, metas e investimentos.">
    <title>Entrar · Patrimônio 360</title>
    <link rel="icon" href="favicon.svg?v=2" type="image/svg+xml">
    <link rel="icon" type="image/png" href="assets/images/icon-192.png">
    <link rel="apple-touch-icon" href="assets/images/icon-192.png">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/variables.css">
    <link rel="stylesheet" href="assets/css/reset.css">
    <link rel="stylesheet" href="assets/css/global.css">
    <link rel="stylesheet" href="assets/css/login.css">
    <link rel="stylesheet" href="assets/css/auth-v43.css">
</head>
<body>
<main class="login-page">
    <div class="login-left">
        <form id="loginForm" class="login-card" novalidate>
            <img src="assets/images/logo-full.png" alt="" class="auth-mobile-logo" aria-hidden="true">
            <h1>Entrar</h1>
            <p>Faça login para acessar sua conta.</p>
            <div class="form-group"><label for="email">E-mail</label><input id="email" type="email" placeholder="seu@email.com" autocomplete="email" inputmode="email" autocapitalize="off" spellcheck="false" required></div>
            <div class="form-group"><label for="password">Senha</label><input id="password" type="password" placeholder="Digite sua senha" autocomplete="current-password" required></div>
            <div class="auth-row">
                <label class="auth-check"><input id="remember" type="checkbox" checked> Manter conectado</label>
                <button id="btnForgot" type="button" class="btn-link" aria-expanded="false" aria-controls="forgotPanel">Esqueci minha senha</button>
            </div>
            <div class="forgot-panel" id="forgotPanel"><p>Informe seu e-mail e enviaremos um link para redefinir sua senha.</p><div class="forgot-row"><label for="forgotEmail" class="sr-only">E-mail para redefinição</label><input id="forgotEmail" type="email" placeholder="seu@email.com" autocomplete="email" inputmode="email"><button id="sendReset" type="button">Enviar link</button></div></div>
            <span id="message" class="form-message" aria-live="polite"></span>
            <button class="btn-login" type="submit">Entrar</button>
            <button id="btnRegister" type="button" class="btn-secondary">Criar conta</button>
        </form>
    </div>
    <div class="login-right">
        <img src="assets/images/logo-full.png" alt="Patrimônio 360" class="brand-logo">
        <h2>Sua vida financeira em um só lugar.</h2>
        <p>Controle receitas, despesas, cartões, investimentos e patrimônio em um único sistema inteligente.</p>
    </div>
</main>
<script type="module" src="assets/js/auth/login.js"></script>
</body>
</html>
