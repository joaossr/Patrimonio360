<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0c1015">
    <meta name="color-scheme" content="dark">
    <meta name="referrer" content="no-referrer">
    <meta name="robots" content="noindex, nofollow">
    <title>Chaves de acesso · Patrimônio 360</title>
    <link rel="icon" href="/favicon.ico?v=3" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/images/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/assets/images/favicon-192.png?v=3" />
    <link rel="apple-touch-icon" href="/assets/images/apple-touch-gradient.png?v=3" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/assets/css/admin-v62.css">
</head>
<body>
<header class="adm-top">
    <a class="adm-brand" href="/"><img src="/assets/images/logo-mark.png" alt="" width="34" height="34"><span>Patrimônio <b>360</b> · Chaves de acesso</span></a>
    <div class="adm-user"><span id="admUser"></span><button type="button" class="adm-link" id="admLogout" hidden>Sair</button></div>
</header>

<main class="adm-main">
    <p id="admStatus" class="adm-note" role="status">Carregando…</p>

    <div id="admApp" hidden>
        <section class="adm-card" aria-labelledby="genTitle">
            <h1 id="genTitle">Gerar chaves</h1>
            <p class="adm-sub">Cada chave vale para uma única pessoa e só funciona uma vez. O texto da chave aparece só agora: copie e envie.</p>
            <form id="genForm" class="adm-form">
                <label>Quantidade<input id="genCount" type="number" min="1" max="100" value="1" inputmode="numeric"></label>
                <label>Validade do acesso
                    <select id="genDays">
                        <option value="30">30 dias</option>
                        <option value="90">90 dias</option>
                        <option value="180">6 meses</option>
                        <option value="365" selected>1 ano</option>
                        <option value="0">Sem data de vencimento</option>
                    </select>
                </label>
                <label class="adm-wide">Para quem é (opcional)<input id="genLabel" type="text" maxlength="80" placeholder="Ex.: Maria Silva"></label>
                <button class="adm-btn" id="genBtn">Gerar chave</button>
            </form>
            <p id="genError" class="adm-error" role="alert" hidden></p>
            <div id="genResult" hidden>
                <h2>Chaves geradas</h2>
                <ul id="genList" class="adm-keys"></ul>
                <div class="adm-actions"><button type="button" class="adm-btn ghost" id="copyAll">Copiar todas</button><button type="button" class="adm-btn ghost" id="copyMsg">Copiar mensagem para o WhatsApp</button></div>
            </div>
        </section>

        <section class="adm-card" aria-labelledby="listTitle">
            <div class="adm-head"><h2 id="listTitle">Chaves emitidas</h2>
                <div class="adm-filter" role="group" aria-label="Filtrar chaves"><button type="button" data-f="all" class="active">Todas</button><button type="button" data-f="free">Disponíveis</button><button type="button" data-f="used">Usadas</button></div>
            </div>
            <div class="adm-table-wrap"><table class="adm-table"><thead><tr><th>Para</th><th>Final</th><th>Validade</th><th>Criada</th><th>Situação</th><th></th></tr></thead><tbody id="keyRows"></tbody></table></div>
            <p id="listEmpty" class="adm-note" hidden>Nenhuma chave ainda.</p>
        </section>
    </div>
</main>
<div class="adm-toast" id="admToast" role="status" aria-live="polite" hidden></div>
<script type="module" src="/assets/js/admin.js"></script>
</body>
</html>
